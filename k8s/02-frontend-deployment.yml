apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: greencart
  labels:
    app: greencart-fe
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: greencart-fe
  template:
    metadata:
      labels:
        app: greencart-fe
    spec:
      containers:
        - name: greencart-frontend
          image: syedsameer7/greencart-frontend:audit-v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
