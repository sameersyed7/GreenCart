apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: greencart
  labels:
    app: greencart-be
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: greencart-be
  template:
    metadata:
      labels:
        app: greencart-be
    spec:
      containers:
        - name: greencart-backend
          image: syedsameer7/greencart-backend:audit-v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: greencart-configmap
                  key: PORT
            - name: NODE_ENV
              value: "production"
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017/greencart"
          envFrom:
            - secretRef:
                name: greencart-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
