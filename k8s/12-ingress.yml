apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: greencart-ingress
  namespace: greencart
spec:
  ingressClassName: nginx
  rules:
    - host: greencart.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
