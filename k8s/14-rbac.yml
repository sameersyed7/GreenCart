apiVersion: v1
kind: ServiceAccount
metadata:
  name: greencart-auditor
  namespace: greencart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: greencart-pod-reader
  namespace: greencart
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: greencart-auditor-binding
  namespace: greencart
subjects:
  - kind: ServiceAccount
    name: greencart-auditor
    namespace: greencart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: greencart-pod-reader
